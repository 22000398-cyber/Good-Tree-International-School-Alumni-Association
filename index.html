function likeQtComment(index, type) {
  qtCommentsDatabase = JSON.parse(localStorage.getItem('qtCommentsDatabase')) || {};
  
  const target = qtCommentsDatabase[selectedQtDate]?.[index];
  if (!target) return;

  if (!target.id) {
    target.id = 'cmt_' + selectedQtDate + '_' + index;
  }

  let myLikedComments = JSON.parse(localStorage.getItem('myLikedComments')) || [];
  const key = `${target.id}_${type}`;

  if (myLikedComments.includes(key)) {
    alert("?��? 공감???�시?�셨?�니??");
    return;
  }

  if (type === 'like') target.likes = (target.likes || 0) + 1;
  if (type === 'heart') target.hearts = (target.hearts || 0) + 1;

  myLikedComments.push(key);

  localStorage.setItem('myLikedComments', JSON.stringify(myLikedComments));
  localStorage.setItem('qtCommentsDatabase', JSON.stringify(qtCommentsDatabase));
  renderQtComments();
}
